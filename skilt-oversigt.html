<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A4 Printklart Skilt · Gistrup Ande TV</title>
  <style>
    :root {
      --brand-green: #03522d;
      --bg-cream: #f4f6f0;
      --card-bg: #ffffff;
      --border-color: #d2e4ce;
      --text-dark: #1b2f21;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-dark);
      background: var(--bg-cream);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { padding: 40px 24px; line-height: 1.5; }
    .container { max-width: 900px; margin: 0 auto; }
    
    header {
      text-align: center;
      margin-bottom: 36px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      color: var(--brand-green);
      margin-bottom: 12px;
    }
    .brand img { width: 68px; height: 68px; }
    .brand h1 { font-size: 30px; line-height: 1.15; font-weight: 800; letter-spacing: -0.8px; text-align: left; }
    header p { font-size: 16px; color: #4b6651; max-width: 700px; margin: 8px auto 0; }
    
    .card {
      background: var(--card-bg);
      border: 2px solid var(--brand-green);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(3, 82, 45, 0.12);
      display: flex;
      flex-direction: column;
      margin-bottom: 40px;
    }
    .card-header {
      padding: 24px;
      border-bottom: 1px solid var(--border-color);
      background: #fafcf9;
      text-align: center;
    }
    .card-header h2 {
      font-size: 24px;
      color: var(--brand-green);
      font-weight: 800;
      margin-bottom: 6px;
    }
    .preview-box {
      padding: 30px;
      background: #edf3ea;
      text-align: center;
    }
    .preview-box img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.16);
    }
    .card-actions {
      padding: 24px;
      display: flex;
      gap: 16px;
      background: #ffffff;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: var(--brand-green);
      color: #ffffff;
      border: 1px solid var(--brand-green);
    }
    .btn-primary:hover {
      background: #196944;
    }
    .btn-secondary {
      background: #f1f7ef;
      color: var(--brand-green);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover {
      background: #e3efe1;
    }
    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      color: #6a8270;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <img src="./public/gistrup-ande-tv.png" alt="Gistrup Ande TV logo">
        <h1>Gistrup<br>Ande TV</h1>
      </div>
      <p>Printklart A4-skilt i høj opløsning (300 DPI · 2480 × 3508 px).</p>
    </header>

    <article class="card">
      <div class="card-header">
        <h2>Det færdige A4-skilt</h2>
      </div>
      <div class="preview-box">
        <a href="./skilt-a4-print.png" target="_blank" title="Åbn billede i fuld 300 DPI opløsning">
          <img src="./skilt-a4-print-preview.jpg" alt="A4 skilt preview">
        </a>
      </div>
      <div class="card-actions">
        <a class="btn btn-primary" href="./skilt-a4-print.png" download="Gistrup-Ande-TV-Skilt-A4.png">
          📥 Hent billede (PNG · 300 DPI)
        </a>
        <a class="btn btn-secondary" href="./skilt-a4-print.pdf" target="_blank">
          📄 Åbn som PDF (Klar til print)
        </a>
      </div>
    </article>

    <footer>
      <p>Gistrup Ande TV · <a href="https://krauhe.github.io/DuckTV/" style="color:var(--brand-green);">krauhe.github.io/DuckTV/</a></p>
    </footer>
  </div>
</body>
</html>
