<style>
body{margin:0;background:#aeb9ad;color:#20342a;font:15px system-ui}header{position:absolute;top:16px;left:24px;right:24px}h1{font-size:22px;margin:0 0 8px}nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap}select,button{font:inherit;padding:6px;border:1px solid #6b8073;border-radius:5px;background:#eef0e9;color:inherit}label{display:flex;align-items:center;gap:8px}canvas{display:block}footer{position:absolute;bottom:16px;left:24px;right:24px;font-size:13px}a{color:inherit}#identities{display:flex;justify-content:space-around;gap:15px;margin-bottom:16px}#identities span{max-width:180px;text-align:center}input{accent-color:#466c50}

<body><header><h1>De fire ænder</h1><nav><a href="./">Tilbage til haven</a><label>And <select id="individual"><option value="all">Alle fire</option><option value="drake">Hannen</option><option value="buff">Lys hun</option><option value="brown">Mønstret hun</option><option value="pied">Broget hun</option></select></label><label>Bevægelse <select id="clip"><option value="none">Stå og kig</option><option value="lowStand">Lav ståstilling</option><option value="walk">Gang</option><option value="slowWalk">Langsom gang</option><option value="walkFlap">Gang med bask</option><option value="wingFlap">Bask</option><option value="wingStretch">Vingestræk</option><option value="tailWag">Rumpevrik</option><option value="eat">Pasta: optag og håndter</option><option value="courtship">Parringsinvitation</option><option value="forage">Fødesøgning</option><option value="preen">Puds ryg/vinge</option><option value="preenChest">Puds bryst</option></select></label><label>Vinkel <input id="angle" type="range" min="-3.14" max="3.14" step=".01" value=".8"></label><label>Tempo <select id="rate"><option value="1">Normal</option><option value="0.5">Halv hastighed</option><option value="0.25">Kvart hastighed</option></select></label><button id="pause">Pause</button><label>Forløb <input id="progress" type="range" min="0" max="1" step=".005" value="0"></label></nav></header><footer><div id="identities"></div>Modelstudie med samme modeller som haven. De viste bevægelser kan standses og ses fra alle sider; i haven vælger hver and sit eget forløb.</footer><script type="module" src="/src/reference-view.ts"></script></body></html>
